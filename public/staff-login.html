 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Bhavani Transport</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101c32;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 38px;
      box-sizing: border-box;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      width: 62px;
      height: 62px;
      margin: auto;
      border-radius: 15px;
      background: #e9b949;
      color: #101c32;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: bold;
    }

    .brand h1 {
      color: #101c32;
      font-size: 23px;
      margin: 15px 0 5px;
    }

    .brand p {
      color: #778094;
      font-size: 13px;
      margin: 0;
    }

    .login-wrapper h2 {
      color: #101c32;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #778094;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #26344c;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce1e9;
      border-radius: 9px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #d9a72e;
      box-shadow: 0 0 0 3px rgba(217,167,46,.12);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #e9b949;
      color: #101c32;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: #d9a72e;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 11px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
    }

    .error {
      display: block !important;
      color: #a12626;
      background: #fff0f0;
    }

    .success {
      display: block !important;
      color: #17643a;
      background: #eaf8ef;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #778094;
      text-decoration: none;
      font-size: 13px;
    }

    .back-link:hover {
      color: #101c32;
    }

    .security-note {
      text-align: center;
      font-size: 11px;
      color: #9aa2af;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <div class="brand">
      <div class="brand-logo">BT</div>
      <h1>Bhavani Transport</h1>
      <p>Logistics Management System</p>
    </div>

    <h2>Staff Login</h2>
    <p class="subtitle">Sign in to access your administration panel.</p>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter staff username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Sign In
      </button>

      <div id="message" role="alert"></div>

    </form>

    <a href="index.html" class="back-link">
      ← Back to Customer Website
    </a>

    <p class="security-note">
      Restricted access · Authorized staff only
    </p>

  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    // Redirect already authenticated staff
    fetch("/api/auth/me")
      .then(response => {
        if (response.ok) {
          window.location.href = "dashboard.html";
        }
      })
      .catch(() => {});

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.className = "";
      message.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed.");
        }

        message.textContent = "Login successful! Redirecting...";
        message.className = "success";

        window.location.href = "dashboard.html";

      } catch (error) {
        message.textContent = error.message;
        message.className = "error";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    });
  </script>

</body>
</html>
